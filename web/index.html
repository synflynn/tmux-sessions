<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tmux sessions</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3CclipPath id='c'%3E%3Crect x='0' y='9.5' width='32' height='18'/%3E%3C/clipPath%3E%3Cg clip-path='url%28%23c%29' stroke='%23e8873a' stroke-width='5.5'%3E%3Cline x1='6.5' y1='6.5' x2='25.5' y2='30.5'/%3E%3Cline x1='25.5' y1='6.5' x2='6.5' y2='30.5'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root { --bg:#0e0f11; --card:#17191c; --line:#2a2d32; --text:#e6e6e6; --dim:#8a8f98; --accent:#e8873a;
          --green:#3ec46d; --red:#e5534b; --yellow:#e0b341; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1120px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; align-items:center; flex-wrap:wrap; justify-content:space-between; gap:12px; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  h1 span { color:var(--accent); } h1 #host { color:var(--text); }
  .meta { color:var(--dim); font-size:13px; }
  .gauges { display:flex; gap:14px; }
  .gauge { width:130px; font-size:12px; color:var(--dim); }
  .gauge .top { display:flex; justify-content:space-between; margin-bottom:3px; }
  .gauge .top b { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
  .bar { height:7px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--green); border-radius:4px; transition:width .6s, background .6s; }
  .gauge .sub { margin-top:2px; font-size:11px; font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--dim); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:0; }
  code { font:13px ui-monospace, Menlo, Consolas, monospace; color:#c9d1d9; }
  td b, td code { white-space:nowrap; }
  .state { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .running .dot { background:var(--green); } .error .dot { background:var(--red); }
  .starting .dot, .stopping .dot { background:var(--yellow); animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .err { color:var(--red); font-size:12px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  button { font:inherit; border:1px solid var(--line); background:#22252a; color:var(--text); border-radius:7px;
           padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.on { background:var(--green); border-color:var(--green); color:#0b1a10; }
  button.off { background:transparent; border-color:var(--red); color:var(--red); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1a0e04; }
  button.link { background:none; border:0; color:var(--dim); padding:4px 6px; }
  button:disabled { opacity:.4; cursor:default; }
  input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); }
  .actions { white-space:nowrap; text-align:right; }
  #meta { margin:-8px 0 10px; }
  h2 { font-size:15px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 10px; }
  h2:first-of-type { margin-top:4px; }
  .note { color:var(--dim); font-size:12px; max-width:260px; }
  td.caps-cell { white-space:nowrap; }
  th { white-space:nowrap; }
  .chip { display:inline-block; font-size:11px; padding:1px 7px; margin:1px 3px 1px 0; border-radius:9px;
          border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .chip.on { color:var(--text); border-color:#4a4f57; }
  select { font:14px system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text);
           border:1px solid var(--line); border-radius:7px; padding:5px 8px; }
  .seen { font-size:13px; white-space:nowrap; } .seen.fresh { color:var(--green); }
  td.grip { width:1%; padding-right:0; color:var(--dim); font-size:18px; cursor:grab; touch-action:none; user-select:none; }
  td.grip:hover { color:var(--text); }
  tr.dragging { background:var(--line); }
  tr.dragging td.grip { cursor:grabbing; }
  #msg { margin-top:10px; min-height:20px; color:var(--red); font-size:13px; }
  td[data-l=path] code { white-space:normal; }
  .ver { font-size:13px; white-space:nowrap; } .ver.old { color:var(--yellow); } .ver.new { color:var(--green); }
  button.icon { width:32px; height:32px; padding:0; display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; }
  button.icon svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  button.icon.on svg, button.icon.off svg { fill:currentColor; stroke:none; }
  .actions .gap { display:inline-block; width:32px; }
  .actions > * + * { margin-left:6px; }
  .total { color:var(--dim); font-size:13px; margin-top:8px; text-align:right; }
  @media (max-width:720px) {
    thead { display:none; }
    table, tbody, tr, td { display:block; width:100%; }
    tr { border-bottom:1px solid var(--line); padding:8px 0; }
    td { border:0; padding:4px 12px; }
    tr { position:relative; }
    td.grip { position:absolute; top:4px; right:4px; width:auto; padding:8px 12px; font-size:22px; }
    td.num, td.actions { text-align:left; }
    td[data-l]::before { content:attr(data-l) " "; color:var(--dim); font-size:12px; }
  }
  @media (min-width:721px) {   /* desktop: wider, paths on one line, sessions fit a 1080p screen */
    main { max-width:1360px; padding:14px 16px 16px; }
    td code, td[data-l=path] code { white-space:nowrap; }
    th, td { padding:7px 12px; }
    th { padding-top:9px; padding-bottom:9px; }
    header { margin-bottom:8px; }
    h2 { margin:12px 0 8px; }
    tbody tr { transition:background .12s; }
    tbody tr:hover { background:#24282e; }   /* row highlight, rows are wide */
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>tmux</span> sessions<span id="host"></span></h1>
    <div class="gauges">
      <div class="gauge"><div class="top"><span>CPU</span><b id="cpu-pct">–</b></div><div class="bar"><i id="cpu-bar"></i></div></div>
      <div class="gauge"><div class="top"><span>RAM</span><b id="ram-pct">–</b></div><div class="bar"><i id="ram-bar"></i></div>
        <div class="sub" id="ram-sub"></div></div>
    </div>
  </header>
  <div class="meta" id="meta"></div>
  <h2>Sessions</h2>
  <table>
    <thead><tr><th></th><th>Session</th><th>Project path</th><th>tmux</th><th>Boot</th><th>State</th><th>Claude</th><th class="num">RAM</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="total" id="total"></div>
  <div id="msg"></div>

</main>
<script>
const $ = id => document.getElementById(id);
let sessions = [], dragging = false, latest = null;
const GRIP = '<td class="grip" title="drag to reorder" onpointerdown="dragStart(event)">⠿</td>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function post(body) {
  const r = await fetch('api.php', { method:'POST', headers:{'Content-Type':'application/json', 'X-Tmux-Web':'1'}, body:JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error:'HTTP ' + r.status }));
  $('msg').textContent = j.error || '';
  await load();
  return !j.error;
}

function render() {
  let total = 0, oldest = 0;
  $('rows').innerHTML = sessions.map(s => {
    const busy = s.actual_state !== s.desired_state && s.actual_state !== 'error';
    const st = busy && s.actual_state !== 'starting' && s.actual_state !== 'stopping'
      ? (s.desired_state === 'running' ? 'starting' : 'stopping') : s.actual_state;
    const up = s.desired_state === 'running';
    if (s.rss_mb) total += +s.rss_mb;
    oldest = Math.max(oldest, s.seen_ago ?? 9999);
    return `<tr data-id="${s.id}">${GRIP}
      <td data-l="session"><b>${esc(s.session_name)}</b></td>
      <td data-l="path"><code>${esc(s.project_path).replace(/\//g, '/<wbr>')}</code></td>
      <td data-l="tmux"><code>${esc(s.tmux_alias)}</code></td>
      <td data-l="boot"><input type="checkbox" ${+s.start_on_boot ? 'checked' : ''} onchange="post({action:'boot', id:${s.id}, on:this.checked})"></td>
      <td data-l="state"><span class="state ${st}"><span class="dot"></span>${st}</span>${s.last_error ? `<div class="err">${esc(s.last_error)}</div>` : ''}</td>
      <td data-l="claude">${verCell(s)}</td>
      <td class="num" data-l="ram">${s.rss_mb != null ? s.rss_mb + ' MB' : '–'}</td>
      <td class="actions">
        ${isOld(s) && !+s.update_requested && st === 'running' ? `<button class="icon primary" onclick="update(${s.id})" title="update to ${esc(latest)} (restart with --continue)">${ICON.update}</button>` : '<span class="gap"></span>'}<button class="icon ${up ? 'off' : 'on'}" onclick="toggle(${s.id})" title="${up ? 'stop' : 'start'}">${up ? ICON.stop : ICON.start}</button>
      </td></tr>`;
  }).join('');
  $('total').textContent = [total ? `total ${total} MB` : '', latest ? `newest Claude Code ${latest}` : ''].filter(Boolean).join(' · ');
  $('meta').textContent = oldest > 30 ? '⚠ agent not reporting (is tmux-claude-sessions running?)' : '';
}

// Running sessions keep the Claude Code binary they started with; the installer updates the newest on its own
const ICON = {
  start: '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z"/></svg>',
  stop: '<svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>',
  update: '<svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2v3.5H10"/></svg>',
};
const isOld = s => s.claude_version && latest && s.claude_version !== latest;
function verCell(s) {
  if (+s.update_requested) return '<span class="ver old">updating…</span>';
  if (!s.claude_version) return '–';
  return `<span class="ver ${isOld(s) ? 'old' : 'new'}" title="${isOld(s) ? 'newest installed: ' + esc(latest) : 'newest'}">${esc(s.claude_version)}</span>`;
}



function gauge(key, pct) {
  const bar = $(key + '-bar');
  bar.style.width = Math.min(100, pct) + '%';
  bar.style.background = pct >= 90 ? 'var(--red)' : pct >= 70 ? 'var(--yellow)' : 'var(--green)';
  $(key + '-pct').textContent = Math.round(pct) + ' %';
}

function renderHost(h) {
  if (!h || h.age > 30) { $('cpu-pct').textContent = $('ram-pct').textContent = '–'; $('ram-sub').textContent = ''; return; }
  gauge('cpu', +h.cpu_pct);
  gauge('ram', 100 * h.mem_used_mb / h.mem_total_mb);
  const gb = mb => (mb / 1024).toFixed(1);
  $('ram-sub').textContent = `${gb(h.mem_used_mb)} / ${gb(h.mem_total_mb)} GB` + (+h.swap_used_mb ? ` · swap ${gb(h.swap_used_mb)}` : '');
}

// Drag a row by its handle (pointer events, so it works with touch too); the new order goes to the DB
function dragStart(e) {
  const grip = e.currentTarget, row = grip.closest('tr'), body = row.parentNode;
  const before = [...body.children].map(r => r.dataset.id).join();
  e.preventDefault();
  dragging = true;
  row.classList.add('dragging');
  try { grip.setPointerCapture(e.pointerId); } catch (_) {}
  const move = ev => {
    const next = [...body.children].find(r => r !== row && ev.clientY < r.getBoundingClientRect().top + r.offsetHeight / 2);
    if (next !== row.nextElementSibling) body.insertBefore(row, next || null);
  };
  const end = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', end);
    window.removeEventListener('pointercancel', end);
    row.classList.remove('dragging');
    dragging = false;
    const ids = [...body.children].map(r => r.dataset.id);
    if (ids.join() !== before) post({ action:'reorder', ids });
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
}

async function load() {
  if (dragging) return;
  try {
    const j = await (await fetch('api.php', { cache:'no-store' })).json();
    sessions = j.sessions || [];
    latest = j.host && j.host.claude_latest;
    $('host').textContent = j.host ? ' · ' + j.host.host : '';
    render();
    renderHost(j.host);
  } catch (e) { $('meta').textContent = 'api unreachable'; }
}

function toggle(id) {
  const s = sessions.find(x => x.id == id);
  post({ action:'state', id, state: s.desired_state === 'running' ? 'stopped' : 'running' });
}

function update(id) {
  post({ action:'update', id });
}

load();
setInterval(load, 3000);
</script>
</body>
</html>
