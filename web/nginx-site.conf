# tmux-claude-sessions page (keep it LAN only or put basic auth in front of it)
server {
    listen 80;
    listen [::]:80;
    server_name tmux.example.com;
    root /var/www/tmux;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }
}
